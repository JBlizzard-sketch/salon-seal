openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SalonSeal API - No-show deposit system for Nairobi salons
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: salons
    description: Salon management
  - name: services
    description: Service catalog
  - name: staff
    description: Staff management
  - name: bookings
    description: Booking management
  - name: clients
    description: Client management
  - name: dashboard
    description: Dashboard analytics
  - name: reminders
    description: WhatsApp reminder management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Salons ──────────────────────────────────────────────────────────────────
  /salons:
    get:
      operationId: listSalons
      tags: [salons]
      summary: List all salons
      responses:
        "200":
          description: List of salons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salon"
    post:
      operationId: createSalon
      tags: [salons]
      summary: Create a salon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalonBody"
      responses:
        "201":
          description: Created salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"

  /salons/{id}:
    get:
      operationId: getSalon
      tags: [salons]
      summary: Get salon by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Not found
    patch:
      operationId: updateSalon
      tags: [salons]
      summary: Update salon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalonBody"
      responses:
        "200":
          description: Updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"

  /salons/by-slug/{slug}:
    get:
      operationId: getSalonBySlug
      tags: [salons]
      summary: Get salon by booking slug (public booking page)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Salon with services and staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonPublic"
        "404":
          description: Not found

  # ── Services ─────────────────────────────────────────────────────────────────
  /salons/{salonId}/services:
    get:
      operationId: listServices
      tags: [services]
      summary: List services for a salon
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Add a service to a salon
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceBody"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /salons/{salonId}/services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceBody"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Staff ─────────────────────────────────────────────────────────────────────
  /salons/{salonId}/staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff for a salon
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Add a staff member
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberBody"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /salons/{salonId}/staff/performance:
    get:
      operationId: getStaffPerformance
      tags: [staff]
      summary: Get performance stats for all staff in a salon
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, 3months, 6months, all]
      responses:
        "200":
          description: Staff performance stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStaffPerformanceResponse"

  /salons/{salonId}/staff/{id}:
    patch:
      operationId: updateStaffMember
      tags: [staff]
      summary: Update staff member
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffMemberBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: deleteStaffMember
      tags: [staff]
      summary: Delete staff member
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Bookings ──────────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings (filterable by salonId, status, staffId)
      parameters:
        - name: salonId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: staffId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking (client-facing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Created booking(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingResponse"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found

  /bookings/{id}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (arrived, no-show, completed, cancelled)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusBody"
      responses:
        "200":
          description: Updated booking with auto-blacklist info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBookingStatusResponse"

  /bookings/{id}/simulate-payment:
    post:
      operationId: simulateMpesaPayment
      tags: [bookings]
      summary: Simulate an M-Pesa deposit payment (dev/demo use)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatePaymentResponse"
        "400":
          description: Already paid or invalid state
        "404":
          description: Not found

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking (checks cancellation window, triggers refund if eligible)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingBody"
      responses:
        "200":
          description: Cancellation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResult"

  /bookings/{id}/send-deposit-nudge:
    post:
      operationId: sendDepositNudge
      tags: [bookings]
      summary: Send a WhatsApp M-Pesa payment request to client for unpaid deposit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Nudge sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositNudgeResponse"
        "400":
          description: Deposit already paid or booking in invalid state
        "404":
          description: Not found

  /bookings/{id}/staff:
    patch:
      operationId: assignBookingStaff
      tags: [bookings]
      summary: Assign or reassign a staff member to a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBookingStaffBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found

  /bookings/{id}/reschedule:
    patch:
      operationId: rescheduleBooking
      tags: [bookings]
      summary: Reschedule a booking to a new date/time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleBookingBody"
      responses:
        "200":
          description: Rescheduled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found

  # ── Waitlist ─────────────────────────────────────────────────────────────────
  /salons/{salonId}/waitlist:
    get:
      operationId: getWaitlist
      tags: [waitlist]
      summary: List all waitlist entries for a salon
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Waitlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistListResponse"
    post:
      operationId: addToWaitlist
      tags: [waitlist]
      summary: Add a client to the waitlist for a specific slot
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToWaitlistBody"
      responses:
        "201":
          description: Added to waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"

  /salons/{salonId}/waitlist/{id}:
    delete:
      operationId: removeFromWaitlist
      tags: [waitlist]
      summary: Remove a waitlist entry (dismiss after notifying)
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /salons/{salonId}/waitlist/{id}/notify:
    patch:
      operationId: markWaitlistNotified
      tags: [waitlist]
      summary: Mark a waitlist entry as notified
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"

  # ── Reminders ──────────────────────────────────────────────────────────────────
  /bookings/{id}/send-reminder:
    post:
      operationId: sendBookingReminder
      tags: [reminders]
      summary: Send a WhatsApp reminder for a specific booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendReminderBody"
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendReminderResponse"
        "400":
          description: Cannot send reminder (booking is cancelled/completed/no_show)
        "404":
          description: Not found

  /salons/{salonId}/reminders/process:
    post:
      operationId: processReminders
      tags: [reminders]
      summary: Auto-process all due 24h and 2h reminders for a salon
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Process results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessRemindersResponse"

  /salons/{salonId}/reminders:
    get:
      operationId: listReminders
      tags: [reminders]
      summary: List all WhatsApp reminders sent for a salon
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of sent reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReminderItem"

  # ── Clients ───────────────────────────────────────────────────────────────────
  /salons/{salonId}/clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients for a salon (CRM view)
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"

  /salons/{salonId}/clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client with full history
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client with visit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client's notes or other editable fields
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          description: Not found

  /salons/{salonId}/staff/{staffId}/blocks:
    get:
      operationId: listStaffBlocks
      tags: [staff]
      summary: List time-off blocks for a staff member
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Staff blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListStaffBlocksResponse"
    post:
      operationId: createStaffBlock
      tags: [staff]
      summary: Create a time-off block for a staff member
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffBlockBody"
      responses:
        "201":
          description: Created block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStaffBlockResponse"

  /salons/{salonId}/staff/{staffId}/blocks/{blockId}:
    delete:
      operationId: deleteStaffBlock
      tags: [staff]
      summary: Delete a time-off block
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
        - name: blockId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /salons/{salonId}/staff/{staffId}/busy-slots:
    get:
      operationId: getStaffBusySlots
      tags: [staff]
      summary: Get booked appointment times for a staff member on a given date
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of busy time slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffBusySlotsResponse"

  /salons/{salonId}/clients/{id}/blacklist:
    patch:
      operationId: setClientBlacklist
      tags: [clients]
      summary: Block or unblock a client from making new bookings
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBlacklistBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          description: Not found

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  /salons/{salonId}/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary — today's bookings, revenue, no-show rate, deposits held
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /salons/{salonId}/analytics:
    get:
      operationId: getSalonAnalytics
      tags: [dashboard]
      summary: Analytics — peak days, popular services, staff performance, weekly trend
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [week, month, 3months, 6months, all]
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonAnalytics"

  /salons/{salonId}/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent bookings activity feed
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BusinessDayHours:
      type: object
      properties:
        isOpen:
          type: boolean
        openTime:
          type: string
        closeTime:
          type: string
      required:
        - isOpen
        - openTime
        - closeTime

    BusinessHours:
      type: object
      properties:
        monday:
          $ref: "#/components/schemas/BusinessDayHours"
        tuesday:
          $ref: "#/components/schemas/BusinessDayHours"
        wednesday:
          $ref: "#/components/schemas/BusinessDayHours"
        thursday:
          $ref: "#/components/schemas/BusinessDayHours"
        friday:
          $ref: "#/components/schemas/BusinessDayHours"
        saturday:
          $ref: "#/components/schemas/BusinessDayHours"
        sunday:
          $ref: "#/components/schemas/BusinessDayHours"
      required:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday

    Salon:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        phone:
          type: string
        location:
          type: string
        cancellationWindowHours:
          type: integer
        platformFeePercent:
          type: number
        monthlyRevenueGoal:
          type: ["integer", "null"]
        autoBlacklistThreshold:
          type: ["integer", "null"]
        businessHours:
          $ref: "#/components/schemas/BusinessHours"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - phone
        - location
